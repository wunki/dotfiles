# cendre · hard · https://github.com/Aejkatappaja/cendre
# generated by scripts/extras.lua, do not edit
# source-file ~/.config/tmux/cendre.tmux.conf

# Keep the bar visually attached to the terminal and let one raised surface mark
# the active window. The session moves right so it does not compete with tabs.

set -g status-style "bg=#171311 fg=#73665b"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 40

set -g status-left ""
set -g status-right "#[fg=#73665b,bg=#171311]#{?client_prefix,#[fg=#ea9875,bold]PREFIX #[fg=#73665b,nobold],}#{session_name}  "

set -g window-status-separator ""
set -g window-status-format "#[fg=#a09384,bg=#171311,bold]  #{window_index} #[fg=#73665b,nobold]#{window_name}#{?window_zoomed_flag, Z,}  "
set -g window-status-current-format "#[fg=#fcba81,bg=#2a2422,bold]  #{window_index} #[fg=#ea9875,nobold]#{window_name}#{?window_zoomed_flag, Z,}  "
set -g window-status-last-style "fg=#a09384"
set -g window-status-activity-style "fg=#f4a21c"

set -g pane-border-style "fg=#362f2c"
set -g pane-active-border-style "fg=#ea9875"

set -g message-style "bg=#ea9875 fg=#171311 bold"
set -g message-command-style "bg=#2a2422 fg=#e6d5c2"

set -g mode-style "bg=#2f1e17 fg=#e6d5c2"

# Do not inherit text attributes from the previously loaded theme.
set -g window-status-current-style "default"
