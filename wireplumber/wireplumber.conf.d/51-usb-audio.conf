# USB audio devices often expose equivalent PCM endpoints as misleading
# "Analog" and "S/PDIF" profiles. Use their direct ALSA nodes instead so
# GNOME lists each real endpoint once.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Apple_Inc._Studio_Display_.*" }
      { device.name = "~alsa_card.usb-KEF_LSX_II.*" }
      { device.name = "~alsa_card.usb-R__DE_RODECaster_Duo_.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
        device.profile = "pro-audio"
        api.acp.auto-profile = false
        api.acp.auto-port = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Apple_Inc._Studio_Display_.*" }
    ]
    actions = {
      update-props = {
        node.description = "Studio Display"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-KEF_LSX_II.*" }
    ]
    actions = {
      update-props = {
        node.description = "LSX II"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*.pro-output-0" }
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*.playback.0.0" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*.pro-output-1" }
      { node.name = "~alsa_output.usb-R__DE_RODECaster_Duo_.*.playback.1.0" }
    ]
    actions = {
      update-props = {
        node.description = "RODECaster Duo Main Stereo"
        priority.session = 1400
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*.pro-input-0" }
      { node.name = "~alsa_input.usb-R__DE_RODECaster_Duo_.*.capture.0.0" }
    ]
    actions = {
      update-props = {
        node.description = "RODECaster Duo Microphone"
      }
    }
  }
]
