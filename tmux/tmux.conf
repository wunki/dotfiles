# Put the prefix on the home row.
unbind C-b
set -g prefix C-h
bind C-h send-prefix

# Keep escape sequences responsive without breaking repeated bindings.
set -sg escape-time 10
set -sg repeat-time 600

# Set the default shell to Fish.
if-shell 'test "$(uname)" = "Linux"' 'set -g default-shell /usr/bin/fish'
if-shell 'test "$(uname)" = "Darwin"' 'set -g default-shell /opt/homebrew/bin/fish'

# Resize a window only while a client is viewing it.
setw -g aggressive-resize off

# Don't detach when I kill a session.
set-option -g detach-on-destroy off

# Close gaps in window numbers.
set -g renumber-windows on

# Mouse support
set -g mouse on

# Open Hunk's live diff in the current directory.
bind-key g new-window -n hunk-diff -c "#{pane_current_path}" "hunk diff --watch --theme auto"

# Index windows and panes from 1.
set -g base-index 1
set -g pane-base-index 1

# Turn the current pane into a session named after its working directory.
bind C-c run-shell "tmux new-session -Ad -s '#{b:pane_current_path}' -c '#{pane_current_path}' && tmux kill-pane -t '#{pane_id}' && tmux switch-client -t '#{b:pane_current_path}'"

# Attach another client with the current pane's working directory.
bind w attach-session -t . -c "#{pane_current_path}" \; display "CWD: #{pane_current_path}"

# Reload the config.
bind r source-file ~/.tmux.conf \; display "Reloaded configuration"

# Disconnect every other client from this session.
bind D detach-client -a \; display "Detached other clients"

# Split in the current pane's working directory.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Session switching
bind S choose-session
bind L switch-client -l

# Pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move the current window left or right.
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# Preserve 24-bit color and Ghostty hyperlinks.
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -gu terminal-features
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -as terminal-features ',ghostty:hyperlinks'

# Undercurl support (for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass extended modifier sequences through tmux.
set -g extended-keys on
set -g extended-keys-format csi-u

# Scrollback and clipboard
set -g history-limit 50000
set -g set-clipboard on
# Allow passthrough for OSC52 clipboard sequences
set -g allow-passthrough on

# Fetch a clipboard image through cc-clip when tmux runs through SSH.
unbind -q I
%if "#{!=:#{SSH_CONNECTION},}"
bind I run-shell -b 'if image_path="$(cc-clip paste --out-dir /tmp/screenhots 2>&1)"; then tmux set-buffer -- "$image_path" && tmux paste-buffer -t "#{pane_id}"; else tmux display-message "Image paste failed: $image_path"; fi'
%endif

# Refresh status bar
set -g status-interval 5

# Activity
setw -g monitor-activity off
set -g visual-activity off

# Rename windows from the active command.
setw -g automatic-rename on

# Propagate window title to terminal (Ghostty)
set -g set-titles on
set -g set-titles-string "#S:#W"

# Report terminal focus changes to Neovim.
set-option -g focus-events on

# Window and session management
bind c new-window
bind C new-session
bind K kill-session
bind , command-prompt "rename-window '%%'"

# Keep the status theme fixed across platforms.
source-file ~/.config/tmux/cendre.tmux.conf

# Set vi-mode
set-window-option -g mode-keys vi

# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
