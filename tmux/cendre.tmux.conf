# cendre · hard · https://github.com/Aejkatappaja/cendre
# source-file ~/.config/tmux/cendre.tmux.conf

# Keep the bar visually attached to the terminal and let one raised surface mark
# the active window. The session moves right so it does not compete with tabs.

set -g status-style "bg=#171311 fg=#73665b"
set -g status-position bottom
set -g status-justify left
set -g status-left-length 0
set -g status-right-length 40

set -g status-left ""
set -g status-right "#[fg=#73665b,bg=#171311]#{?client_prefix,#[fg=#ea9875,bold]PREFIX #[fg=#73665b,nobold],}#{session_name}  "

set -g window-status-separator ""
set -g window-status-style "fg=#73665b,bg=#171311"
set -g window-status-format "#[fg=#a09384,bg=#171311,bold]  #{window_index} #[fg=#73665b,nobold]#{window_name}#{?window_zoomed_flag, Z,}  "
set -g window-status-current-format "#[fg=#fcba81,bg=#2a2422,bold]  #{window_index} #[fg=#ea9875,nobold]#{window_name}#{?window_zoomed_flag, Z,}  "
set -g window-status-current-style "default"
set -g window-status-last-style "fg=#a09384,bg=#171311"
set -g window-status-activity-style "fg=#f4a21c,bg=#171311,bold"
set -g window-status-bell-style "fg=#d25780,bg=#171311,bold"

# tmux styles pane selection and choose-tree previews separately. Keep both on
# the same quiet border, with ember reserved for the pane under your hand.
set -g pane-border-lines single
set -g pane-border-style "fg=#362f2c,bg=#171311"
set -g pane-active-border-style "fg=#ea9875,bg=#171311"
set -g display-panes-colour "#4e89a2"
set -g display-panes-active-colour "#ea9875"
set -g display-panes-border-style "fg=#362f2c,bg=#171311"
set -g tree-mode-border-style "fg=#362f2c,bg=#171311"
set -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#ea9875,#4e89a2}"
set -g tree-mode-selection-style "#{E:mode-style}"
set -g switch-mode-match-style "bg=#4e89a2,fg=#171311,bold"

# Prompts, menus, and popups follow Cendre's raised-surface hierarchy instead
# of falling back to tmux's built-in grey theme.
set -g message-style "bg=#ea9875,fg=#171311,bold"
set -g message-command-style "bg=#2a2422,fg=#e6d5c2"
set -g mode-style "bg=#2f1e17,fg=#e6d5c2"
set -g menu-style "bg=#201b19,fg=#e6d5c2"
set -g menu-selected-style "bg=#ea9875,fg=#171311,bold"
set -g menu-border-style "bg=#171311,fg=#5a504c"
set -g menu-border-lines rounded
set -g popup-style "bg=#0f0c0a,fg=#e6d5c2"
set -g popup-border-style "bg=#0f0c0a,fg=#5a504c"
set -g popup-border-lines rounded

# Copy mode mirrors the editor: a quiet cursor line, frost for all matches, and
# the warm accent for the current match and mark.
set -g copy-mode-current-line-style "bg=#201b19"
set -g copy-mode-line-number-style "fg=#4e4641"
set -g copy-mode-current-line-number-style "fg=#ea9875,bold"
set -g copy-mode-match-style "bg=#4e89a2,fg=#171311"
set -g copy-mode-current-match-style "bg=#fcba81,fg=#171311,bold"
set -g copy-mode-mark-style "bg=#ea9875,fg=#171311,bold"

set -g clock-mode-colour "#ea9875"
set -g clock-mode-style 24
