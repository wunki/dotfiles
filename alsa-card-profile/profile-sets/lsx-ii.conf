; The KEF LSX II reports one USB playback endpoint through both the analog and
; IEC958 mappings. Only expose the front stereo mapping that produces sound.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = lsx-ii-output
priority = 15

; The LSX has only eight hardware volume steps. Stretch them across PipeWire's
; full range so useful hardware gain is available near the start of the slider.
[DecibelFix PCM]
db-values = 0:-120.00 7:0.00
