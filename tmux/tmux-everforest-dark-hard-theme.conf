# EVERFOREST DARK HARD THEME BEGIN
# Matches Ghostty's "Everforest Dark Hard" (bg #1e2326) and the Neovim
# everforest setup; chrome styled after Zed's "material" variant: flat UI
# on the terminal background with green-tinted selections.

color_bg0="#1e2326"
color_bg1="#2e383c"
color_bg2="#374145"
color_bg3="#414b50"
color_bg_green="#3c4841"
color_fg0="#d3c6aa"
color_fg1="#859289"
color_red="#e67e80"
color_orange="#e69875"
color_yellow="#dbbc7f"
color_green="#a7c080"
color_blue="#7fbbb3"
color_aqua="#83c092"
color_purple="#d699b6"
color_grey0="#7a8478"
color_grey1="#859289"

# by default window names will just be their index
set-option -g automatic-rename              on
set-option -g automatic-rename-format       "#I"

# set to 12 for a 12-hour clock
set-option -g clock-mode-style              24
set-option -g clock-mode-colour             "$color_green"

# NOTE: color variable expansion only works in double quotes
set-option -g status-fg                     "$color_fg0"
set-option -g status-bg                     "$color_bg0"
set-option -g copy-mode-current-match-style "fg=$color_bg0,bg=$color_yellow"
set-option -g copy-mode-match-style         "fg=$color_bg0,bg=$color_green"
set-option -g menu-selected-style           "fg=$color_fg0,bg=$color_bg_green"
set-option -g menu-style                    "fg=$color_fg0,bg=$color_bg0"
set-option -g message-style                 "bg=$color_green,fg=$color_bg0"
set-option -g message-command-style         "bg=$color_bg1,fg=$color_fg0"
set-option -g mode-style                    "bg=$color_bg_green,fg=$color_fg0"
set-option -g pane-active-border-style      "fg=$color_green"
set-option -g pane-border-lines             "heavy"
set-option -g pane-border-style             "fg=$color_bg2"
set-option -g popup-border-lines            "rounded"
set-option -g status-right-style            "fg=$color_fg1"
set-option -g window-status-current-style   "fg=$color_green"
set-option -g window-status-style           "fg=$color_fg1"
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# display the window index number or index-number:name if has a name
set-option -g window-status-separator      ''
set-option -g window-status-format         '#[fg=#859289]#[bg=#1e2326] #{?#{==:#W, },#I,#I #[fg=#859289]#[bg=#2e383c] #W }'
set-option -g window-status-current-format '#[fg=#d3c6aa]#[bg=#1e2326]#[bold] #{?#{==:#W, },#I,#I #[fg=#a7c080]#[bg=#3c4841] #W }'

# status right will show the current session name if there is more than one session
set-option -g status-right                 '#{?#{>:#{server_sessions},1}, #[fg=#a7c080]◆ #[fg=#d3c6aa]#{session_name} ,}'
set-option -g status-left                  ''
# EVERFOREST DARK HARD THEME END
