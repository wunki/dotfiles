[ids]

*

[main]

# Tap Caps Lock for Escape; hold it for Control.
capslock = overload(control, esc)

# Swap Alt and Super.
leftalt = leftmeta
leftmeta = leftalt
rightalt = rightmeta
rightmeta = rightalt

# NuPhy sends Studio Display brightness as F15 (up) and F14 (down).
f15 = command(/home/petar/.local/bin/asd-brightness up)
f14 = command(/home/petar/.local/bin/asd-brightness down)
