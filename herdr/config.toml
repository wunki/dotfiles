onboarding = false

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+h"
settings = "prefix+shift+s"
reload_config = "prefix+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+c"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
rename_tab = "prefix+comma"
split_horizontal = "prefix+s"
resize_mode = "prefix+shift+r"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[experimental]
pane_history = true

[theme]
name = "terminal"
auto_switch = false

# Cendre hard palette.
[theme.custom]
accent = "#ea9875"
panel_bg = "#171311"
surface0 = "#201b19"
surface1 = "#2a2422"
surface_dim = "#0f0c0a"
overlay0 = "#73665b"
overlay1 = "#a09384"
text = "#e6d5c2"
subtext0 = "#a09384"
mauve = "#d1766e"
green = "#99af6b"
yellow = "#fcba81"
red = "#d25780"
blue = "#4e89a2"
teal = "#20c9cb"
peach = "#ea9875"
