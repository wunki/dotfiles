onboarding = false

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+h"
settings = "prefix+shift+s"
reload_config = "prefix+r"
workspace_picker = "prefix+w"
goto = "prefix+g"
new_workspace = "prefix+shift+c"
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"
switch_workspace = "prefix+shift+1..9"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
rename_tab = "prefix+comma"
split_horizontal = "prefix+s"
resize_mode = "prefix+shift+r"

[ui]
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[experimental]
pane_history = true

[theme]
name = "terminal"
auto_switch = false

# Everforest Dark Hard, matching Ghostty and the other terminal UI themes.
[theme.custom]
accent = "#a7c080"
panel_bg = "#272e33"
surface0 = "#2e383c"
surface1 = "#374145"
surface_dim = "#272e33"
overlay0 = "#7a8478"
overlay1 = "#859289"
text = "#d3c6aa"
subtext0 = "#859289"
mauve = "#d699b6"
green = "#a7c080"
yellow = "#dbbc7f"
red = "#e67e80"
blue = "#7fbbb3"
teal = "#83c092"
peach = "#e69875"
